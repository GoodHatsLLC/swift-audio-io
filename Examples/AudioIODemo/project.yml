name: AudioIODemo

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.2"
    macOS: "26.2"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  AIO:
    path: ../..

settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.2"
    MACOSX_DEPLOYMENT_TARGET: "26.2"
    SDKROOT: auto
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      ONLY_ACTIVE_ARCH: NO
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  AudioIODemo:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "26.2"
      macOS: "26.2"

    sources:
      - path: AudioIODemo

    settings:
      base:
        PRODUCT_NAME: AudioIODemo
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AudioIODemo
        # Ad-hoc "Sign to Run Locally" — no development team needed. To
        # distribute the sample, override CODE_SIGN_STYLE / DEVELOPMENT_TEAM.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"

        TARGETED_DEVICE_FAMILY[sdk=iphone*]: "1,2"
        SUPPORTS_MACCATALYST: NO

        # Auto-generated Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "AudioIO Demo"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record audio when you start a recording."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]: YES
        INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphone*]: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations[sdk=iphone*]: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

    dependencies:
      - sdk: AVFoundation.framework
      - package: AIO
        product: AudioIO
