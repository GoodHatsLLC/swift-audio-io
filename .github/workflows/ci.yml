name: CI

# Prose-only changes skip CI, but the DocC catalogue under
# Sources/**/*.docc is compiled, not prose — a broken symbol link or a
# malformed directive there is a build failure. So ignore only the
# top-level narrative files rather than every `.md` in the tree.
on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: macOS host tests + iOS Simulator build
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Input configuration API guard
        run: ./bin/check-input-configuration-api.sh

      # Full test run on the macOS host: 186 unit tests across 31 suites.
      # This is the suite that gates correctness.
      - name: SwiftPM tests (macOS host)
        run: xcrun swift test --package-path .

      # iOS coverage is compile-only (build-for-testing, not test). The
      # free-tier GitHub macOS runners are Intel; the iOS Simulator runs
      # under emulation and its CoreAudio audio-unit stack is unreliable
      # (AURemoteIO -10851 at session bring-up), so the audio integration
      # tests can't run deterministically here. What we DO get — and what
      # has the highest value pre-1.0 — is verification that the iOS-only
      # code paths (#if canImport(UIKit) / #if os(iOS)) actually compile.
      # Revisit running the iOS tests when free-tier arm64 macOS runners
      # land, or on a self-hosted Apple-Silicon runner.
      - name: iOS Simulator build (compile-only)
        run: |
          xcodebuild build-for-testing \
            -scheme swift-audio-io-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -skipPackagePluginValidation

      # Compiles Sources/AudioIO/AudioIO.docc. Catches malformed directives
      # and a dropped catalogue, which is how the articles silently rotted
      # before: nothing built them.
      #
      # `--warnings-as-errors` is NOT on yet. The build currently emits ~126
      # "X is ambiguous at '/AudioIO'" warnings, because every symbol
      # re-exported through Exports.swift is visible twice — once as the
      # original and once as the curated `public typealias`. That is a
      # packaging problem, not a docs problem; turn this flag on once the
      # umbrella target stops mirroring symbols.
      - name: DocC build
        run: |
          xcrun swift package --allow-writing-to-directory "$RUNNER_TEMP/docs" \
            generate-documentation --target AudioIO \
            --output-path "$RUNNER_TEMP/docs"
