name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: macOS host tests + iOS Simulator build
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun swift --version

      # Full test run on the macOS host: 186 unit tests across 31 suites.
      # This is the suite that gates correctness.
      - name: SwiftPM tests (macOS host)
        run: xcrun swift test --package-path .

      # iOS coverage is compile-only (build-for-testing, not test). The
      # free-tier GitHub macOS runners are Intel; the iOS Simulator runs
      # under emulation and its CoreAudio audio-unit stack is unreliable
      # (AURemoteIO -10851 at session bring-up), so the audio integration
      # tests can't run deterministically here. What we DO get — and what
      # has the highest value pre-1.0 — is verification that the iOS-only
      # code paths (#if canImport(UIKit) / #if os(iOS)) actually compile.
      # Revisit running the iOS tests when free-tier arm64 macOS runners
      # land, or on a self-hosted Apple-Silicon runner.
      - name: iOS Simulator build (compile-only)
        run: |
          xcodebuild build-for-testing \
            -scheme AIO-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -skipPackagePluginValidation
